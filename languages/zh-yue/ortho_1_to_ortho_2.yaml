direction: ortho_1 -> ortho_2
reversible: false

# ── 说明 ──────────────────────────────────────────────────────────────────────
# 粤拼（标准） → 短粤拼（鱼咪自用）。

# ──────────────────────────────────────────────────────────────────────────────

rules:
  "yu":
    - {to: ü}
  "j":
    - {to: "", before: [i,yu]}
    - {to: y}
  "w":
    - {to: "", before: u}
    - {to: w}
  "aa":
    - {to: a}
  "a":
    - {to: ä}
  "eo":
    - {to: ö}
  "oe":
    - {to: oe, before: "t"}
    - {to: ö}
    #其实"eo/oe"几乎互补，在这里都写作ö，2018年才被接受的特例——拟声词oet——单独保留原拼法。
  "ng":
    - {to: ŋ}
    #零声母与ŋ的区别，无论实际发音合并为其中哪个，都以老派区分为准

  #声调附标暂未支持，暂时只负责把普通数字改为上标
  "1":
    - {to: "¹"}
  "2":
    - {to: "²"}
  "3":
    - {to: "³"}
  "4":
    - {to: "⁴"}
  "5":
    - {to: "⁵"}
  "6":
    - {to: "⁶"}