direction: phono -> ipa
reversible: false

# ── 说明 ──────────────────────────────────────────────────────────────────
# 此阶段处理"正字法元音字母/组合 → 实际 IPA 元音音值"。
# 辅音在 ortho_1→phono 已全部解出，此处 phono→ipa 的辅音规则大部分为直通。
# 元音规则是主要内容，主要依据 wiki 表 §Vowels 和 §Vowel-consonant combinations。
#
# 多跳条件用 before_seq：
#   before_seq:
#     - [ll, m, nn]          # 第一跳：紧邻右侧 token
#     - [$consonant_ortho, "#"]  # 第二跳：再右一位（辅音或词尾）
# 这对应 wiki 里"before ll/m/nn + consonant or word-finally"这类规则。
# ─────────────────────────────────────────────────────────────────────────

rules:
  # ── 辅音直通（已在 ortho→phono 层处理完，此处 identity）────────────────
  p:    [{to: p}]
  b:    [{to: b}]
  "pʰ": [{to: "pʰ"}]
  "pj": [{to: "pj"}]
  "pʰj": [{to: "pʰj"}]
  "t̪":  [{to: "t̪"}]
  d:    [{to: d}]
  "t̪ʰ": [{to: "t̪ʰ"}]
  "tʲ": [{to: "tʲ"}]
  "tʰʲ": [{to: "tʰʲ"}]
  k:    [{to: k}]
  g:    [{to: g}]
  "kʰ": [{to: "kʰ"}]
  "kʲ": [{to: "kʲ"}]
  "kʰʲ": [{to: "kʰʲ"}]
  m:    [{to: m}]
  "mj": [{to: "mj"}]
  n:    [{to: n}]
  "n̪ˠ": [{to: "n̪ˠ"}]
  ɲ:    [{to: ɲ}]
  ŋ:    [{to: ŋ}]
  "ŋʲ": [{to: "ŋʲ"}]
  f:    [{to: f}]
  v:    [{to: v}]
  "vj": [{to: "vj"}]
  "fj": [{to: "fj"}]
  "s̪":  [{to: "s̪"}]
  ʃ:    [{to: ʃ}]
  x:    [{to: x}]
  ç:    [{to: ç}]
  h:    [{to: h}]
  "hj": [{to: "hj"}]
  l:    [{to: l}]
  "l̪ˠ": [{to: "l̪ˠ"}]
  ʎ:    [{to: ʎ}]
  r:    [{to: r}]
  "rˠ": [{to: "rˠ"}]
  ɾ:    [{to: ɾ}]
  "ɾʲ": [{to: "ɾʲ"}]
  j:    [{to: j}]
  w:    [{to: w}]
  ɣ:    [{to: ɣ}]
  ʝ:    [{to: ʝ}]
  xk:   [{to: xk}]
  "kʰɾ": [{to: "kʰɾ"}]
  "kɾ": [{to: "kɾ"}]
  "s̪t̪ɾ": [{to: "s̪t̪ɾ"}]
  "ŋɡ": [{to: "ŋɡ"}]
  "ŋʲɡʲ": [{to: "ŋʲɡʲ"}]

  # ── 元音 → IPA 音值 ──────────────────────────────────────────────────
  # 重要：元音的质量/长度已经在 ortho_1→phono 阶段确定了（见该映射文件顶部
  # 说明——条件需要看正字法辅音 token 如 ll/dh/nn，这些 token 到了 phono
  # 层已经不存在了，所以这一步没法、也不需要重新判断上下文）。
  #
  # 早期版本在这里复制了一份跟 ortho_1→phono 几乎一样、按 before/after
  # 正字法 token 做条件判断的规则表；但那些条件在 phono 层永远不可能命中
  # （邻居此时已经是 phono 形式的辅音，不再是 "dh"/"ll" 这些正字法字符串），
  # 于是这些规则实际上从未生效——它们看起来在做条件音变，实际上只是
  # elsewhere 分支在默默兜底，且个别 elsewhere 目标和 ortho_1→phono 已经
  # 定好的值不一致（例如 o 在 b/bh/g/gh/mh 前应保留为 o，
  # 但这里的 elsewhere 会把它错误地改写成 ɔ）。
  #
  # 这里改成纯粹的 identity 透传：phono 层的元音 token 就是最终 IPA 值，
  # 不需要再做任何判断。若未来要在 phono→ipa 这一层新增条件音变，
  # 判断条件应该基于 phono 层的邻居（辅音音系符号），而不是正字法字符串。
  a:    [{to: a}]
  à:    [{to: "aː"}]
  "ài": [{to: "aː"}]
  ai:   [{to: ai}]
  ao:   [{to: "ɯː"}]
  aoi:  [{to: "ɯː"}]
  e:    [{to: e}]
  è:    [{to: "ɛː"}]
  ea:   [{to: ɛ}]
  "èa": [{to: ia}]
  ei:   [{to: ei}]
  "èi": [{to: "ɛː"}]
  eo:   [{to: ɔ}]
  "eò": [{to: "ɔː"}]
  eu:   [{to: ia}]
  i:    [{to: i}]
  ì:    [{to: "iː"}]
  ia:   [{to: "iə"}]
  "ìo": [{to: "iə"}]
  io:   [{to: i}]
  iu:   [{to: u}]
  "iù": [{to: "uː"}]
  o:    [{to: o}]
  ò:    [{to: "oː"}]
  oi:   [{to: ɤ}]
  "òi": [{to: "ɔː"}]
  u:    [{to: u}]
  ù:    [{to: "uː"}]
  ua:   [{to: ua}]
  uai:  [{to: ua}]
  ui:   [{to: u}]
  "ùi": [{to: "uː"}]

  # 以下是 ortho_1→phono 阶段可能直接产出的 IPA 形元音 token（长元音、
  # 双元音、央元音等），到这一层原样透传。
  "aː": [{to: "aː"}]
  au:   [{to: au}]
  "eː": [{to: "eː"}]
  "iə": [{to: "iə"}]
  "iː": [{to: "iː"}]
  ja:   [{to: ja}]
  ju:   [{to: ju}]
  "jɔː": [{to: "jɔː"}]
  "oː": [{to: "oː"}]
  "uə": [{to: "uə"}]
  "uː": [{to: "uː"}]
  ɔ:    [{to: ɔ}]
  ɔu:   [{to: ɔu}]
  "ɔː": [{to: "ɔː"}]
  ə:    [{to: ə}]
  əi:   [{to: əi}]
  ɛ:    [{to: ɛ}]
  "ɛː": [{to: "ɛː"}]
  ɤ:    [{to: ɤ}]
  ɪ:    [{to: ɪ}]
  ɯ:    [{to: ɯ}]
  ɯi:   [{to: ɯi}]
  "ɯː": [{to: "ɯː"}]

  # 删音符号 / 音节边界透传
  ".":
    - {to: "."}   # 音节边界透传（bh/dh/gh/mh 两元音间有时读作音节边界标点）
