  ipa:
    label: "IPA"
    inventory:
      - p
      - b
      - "pʰ"
      - "ʰp"
      - "pj"
      - "pʰj"
      - "t̪"
      - d
      - "t̪ʰ"
      - "ʰt̪"
      - "tʲ"
      - "tʰʲ"
      - "ʰtʲ"
      - k
      - g
      - "kʰ"
      - "ʰk"
      - "kʲ"
      - "kʰʲ"
      - "ʰkʲ"
      - m
      - "mj"
      - n
      - "n̪ˠ"
      - "ɲ"
      - "ŋ"
      - "ŋʲ"
      - f
      - v
      - "vj"
      - "fj"
      - "s̪"
      - "ʃ"
      - x
      - "ç"
      - h
      - "hj"
      - l
      - "l̪ˠ"
      - "ʎ"
      - r
      - "rˠ"
      - "ɾ"
      - "ɾʲ"
      - j
      - w
      - "ɣ"
      - "ʝ"
      - a
      - "aː"
      - "ɤ"
      - "ɤː"
      - "ɛ"
      - "ɛː"
      - e
      - "eː"
      - i
      - "iː"
      - "ɔ"
      - "ɔː"
      - o
      - "oː"
      - u
      - "uː"
      - "ɯ"
      - "ɯː"
      - "ə"
      - "ɪ"
      - au
      - ai
      - "ɤi"
      - "ɯi"
      - "əi"
      - ia
      - "iə"
      - ua
      - "uə"
      - "ɛu"
      - ja
      - xk
      - "kʰɾ"
      - "kɾ"
      - "s̪t̪ɾ"
      - "ŋɡ"
      - "ŋʲɡʲ"
      - "."

  phono:
    label: "音系转写"
    inventory:
      - p
      - b
      - "pʰ"
      - "pj"
      - "pʰj"
      - "t̪"
      - d
      - "t̪ʰ"
      - "tʲ"
      - "tʰʲ"
      - k
      - g
      - "kʰ"
      - "kʲ"
      - "kʰʲ"
      - m
      - "mj"
      - n
      - "n̪ˠ"
      - "ɲ"
      - "ŋ"
      - "ŋʲ"
      - f
      - v
      - "vj"
      - "fj"
      - "s̪"
      - "ʃ"
      - x
      - "ç"
      - h
      - "hj"
      - l
      - "l̪ˠ"
      - "ʎ"
      - r
      - "rˠ"
      - "ɾ"
      - "ɾʲ"
      - j
      - w
      - "ɣ"
      - "ʝ"
      - xk
      - "kʰɾ"
      - "kɾ"
      - "s̪t̪ɾ"
      - "ŋɡ"
      - "ŋʲɡʲ"
      # 元音音值（ortho_1→phono 阶段已经把元音质量/长度最终确定，见该映射文件
      # 顶部说明；这里必须把所有可能产出的 token 都登记进 inventory，
      # 否则 phono→ipa 阶段用这份 inventory 重新分词时，"au"/"aː" 这类多字符
      # token 会被拆回单字符，丢失原本已经解出的元音信息）。
      - a
      - à
      - e
      - è
      - i
      - ì
      - o
      - ò
      - u
      - ù
      - ai
      - "ài"
      - ao
      - aoi
      - ea
      - "èa"
      - ei
      - "èi"
      - eo
      - "eò"
      - eu
      - ia
      - "ìo"
      - io
      - iu
      - "iù"
      - oa
      - oi
      - "òi"
      - ua
      - uai
      - ui
      - "ùi"
      - "."
      # ── 以下是 ortho_1→phono 规则实际会产出的 IPA 形元音 token，
      #    之前遗漏，导致这些多字符 token 在 phono→ipa 阶段被错误拆散 ──
      - "aː"
      - au
      - "eː"
      - "iə"
      - "iː"
      - ja
      - ju
      - "jɔː"
      - "oː"
      - "uə"
      - "uː"
      - "ɔ"
      - "ɔu"
      - "ɔː"
      - "ə"
      - "əi"
      - "ɛ"
      - "ɛː"
      - "ɤ"
      - "ɪ"
      - "ɯ"
      - "ɯi"
      - "ɯː"

  ortho_1:
    label: "标准正字法"
    inventory:
      # 多字符 token 必须比单字符靠前，tokenizer 贪心匹配
      - chd
      - str
      - gn
      - cn
      - rr
      - nn
      - ng
      - ll
      - bh
      - dh
      - fh
      - gh
      - mh
      - ph
      - sh
      - th
      - ch
      - rt
      - rd
      # 带重音的双字母元音（也要在单字母前）
      - "ài"
      - "èa"
      - "èi"
      - "eò"
      - "eòi"
      - "ìo"
      - "iù"
      - "iùi"
      - "òi"
      - "ùi"
      # 双字母元音
      - ai
      - ao
      - aoi
      - ea
      - ei
      - eo
      - eu
      - ia
      - io
      - iu
      - oa
      - oi
      - ua
      - uai
      - ui
      # 单字母（含重音）
      - à
      - è
      - ì
      - ò
      - ù
      - a
      - b
      - c
      - d
      - e
      - f
      - g
      - h
      - i
      - l
      - m
      - n
      - o
      - p
      - r
      - s
      - t
      - u

classes:
  # 宽元音字母（相邻辅音为宽）
  broad_v:
    - a
    - à
    - o
    - ò
    - u
    - ù
    - ao
    - aoi
    - ua
    - uai
    - ui
    - "ùi"
    - oa
    - oi
    - "òi"
    - io
    - "ìo"

  # 窄元音字母（相邻辅音为窄）
  slender_v:
    - e
    - è
    - i
    - ì
    - ai
    - "ài"
    - ea
    - "èa"
    - ei
    - "èi"
    - eo
    - "eò"
    - "eòi"
    - eu
    - ia
    - iu
    - "iù"
    - "iùi"

  # IPA 层前元音（phono→ipa 阶段用）
  front_v_ipa:
    - i
    - "iː"
    - e
    - "eː"
    - "ɛ"
    - "ɛː"
    - ia
    - "iə"

  # IPA 层后元音
  back_v_ipa:
    - o
    - "oː"
    - "ɔ"
    - "ɔː"
    - u
    - "uː"
    - "ɯ"
    - "ɯː"
    - a
    - "aː"
    - au

  # 正字法层所有元音字母（规则里用 $vowel_ortho 引用）
  vowel_ortho:
    - a
    - à
    - e
    - è
    - i
    - ì
    - o
    - ò
    - u
    - ù
    - ai
    - "ài"
    - ao
    - aoi
    - ea
    - "èa"
    - ei
    - "èi"
    - eo
    - "eò"
    - "eòi"
    - eu
    - ia
    - "ìo"
    - io
    - iu
    - "iù"
    - "iùi"
    - oa
    - oi
    - "òi"
    - ua
    - uai
    - ui
    - "ùi"

  # 正字法层所有辅音字母/digraph（多跳规则里用 $consonant_ortho 作第二跳）
  consonant_ortho:
    - b
    - bh
    - c
    - ch
    - chd
    - cn
    - d
    - dh
    - f
    - fh
    - g
    - gh
    - gn
    - h
    - l
    - ll
    - m
    - mh
    - n
    - ng
    - nn
    - p
    - ph
    - r
    - rd
    - rr
    - rt
    - s
    - sh
    - sr
    - str
    - t
    - th

  # 双唇音（日语鼻音同化也用，这里在盖尔语 meta 里重复定义一次）
  bilabial:
    - b
    - p
    - m

  # 流音/鼻音（插音预留接口，v1.2 实现）
  liquid:
    - l
    - "l̪ˠ"
    - "ʎ"
    - r
    - "rˠ"
    - "ɾ"
    - "ɾʲ"
    - n
    - "n̪ˠ"
    - "ɲ"

  # 插音触发辅音（v1.2 预留）
  epenthetic_trigger:
    - b
    - bh
    - ch
    - g
    - gh
    - m
    - mh
